- method_name: "F1-Score"
  category: "evaluation"
  problem_type: "classification"
  scikit_learn_name: "f1_score"
  statsmodels_name: null
  scipy_name: null
  python_package: "sklearn"
  when_to_use: "Use F1-Score when you need to balance precision and recall, especially with imbalanced datasets. Harmonic mean of precision and recall."
  assumptions:
    - "Binary or multiclass classification"
    - "Equal importance of precision and recall"
  typical_use_cases:
    - "Imbalanced datasets where accuracy is misleading"
    - "When false positives and false negatives are equally costly"
    - "Single metric summarizing precision-recall trade-off"
  interpretation_guide: "F1 = 2 * (Precision * Recall) / (Precision + Recall). Range: 0-1, higher is better. Harmonic mean (penalizes extreme values more than arithmetic mean). F1=1: perfect precision and recall. F1=0: either precision or recall is zero. F1=0.8+ is good, 0.6-0.8 moderate, <0.6 poor. More sensitive to low values: if either precision or recall is low, F1 is low. Use macro-F1 for multiclass (average F1 across classes). Consider F-beta score if precision/recall have different importance: β>1 emphasizes recall, β<1 emphasizes precision."
  evaluation_metrics:
    - "F1 score (0 to 1, higher is better)"
  data_conditions:
    sample_size_min: 20
    sample_size_max: null
    requires_normality: false
    handles_missing_values: false
    handles_categorical: false
    requires_independence: null
    sensitive_to_outliers: false
    requires_balanced: false
    min_categories: 2
    max_categories: null
    requires_paired: false
    handles_multicollinearity: null
    requires_homoscedasticity: null
    requires_linearity: null
    min_features: null
    max_features: null

- method_name: "P-Value Interpretation"
  category: "evaluation"
  problem_type: "statistical_test"
  scikit_learn_name: null
  statsmodels_name: null
  scipy_name: null
  python_package: null
  when_to_use: "Use p-value to determine statistical significance of hypothesis tests and model coefficients. Indicates probability of observing results as extreme as current data if null hypothesis is true."
  assumptions:
    - "Valid test statistic computed (t, F, χ², etc.)"
    - "Test assumptions satisfied"
    - "Appropriate null hypothesis defined"
  typical_use_cases:
    - "Determining if regression coefficient is significant"
    - "Testing if group means differ (ANOVA, t-test)"
    - "Assessing feature importance in statistical models"
  interpretation_guide: "P-value = P(observing test statistic ≥ observed | H₀ is true). NOT the probability H₀ is true. Common threshold α=0.05: p<0.05 → reject H₀ (statistically significant). p<0.001: highly significant (***). p<0.01: very significant (**). p<0.05: significant (*). p≥0.05: not significant (fail to reject H₀). Smaller p → stronger evidence against H₀. P-value alone insufficient: consider effect size, confidence intervals, practical significance. Multiple testing: use Bonferroni correction (divide α by number of tests). P-hacking danger: testing many hypotheses until finding p<0.05 by chance."
  evaluation_metrics:
    - "p-value (0 to 1, smaller indicates stronger evidence)"
    - "Significance level α (typically 0.05, 0.01, 0.001)"
  data_conditions:
    sample_size_min: 10
    sample_size_max: null
    requires_normality: null
    handles_missing_values: false
    handles_categorical: null
    requires_independence: null
    sensitive_to_outliers: null
    requires_balanced: false
    min_categories: null
    max_categories: null
    requires_paired: false
    handles_multicollinearity: null
