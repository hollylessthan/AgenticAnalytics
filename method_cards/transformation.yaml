- method_name: "Mean ± 3 * StdDev Outlier Capping (manual, pandas)"
  category: "preprocessing_outlier_handling"
  problem_type: "feature_engineering"
  data_conditions:
    sample_size_min: 10
    sample_size_max: null
    requires_normality: false
    handles_missing_values: false
    handles_categorical: false
    supports_continuous_target: true
  assumptions:
    - "Feature is continuous and numeric"
    - "Outliers are defined as values outside mean ± 3 * standard deviation"
  when_to_use: "When you need to cap (winsorize) outliers in numeric features using the mean and standard deviation, especially for normally distributed data or when IQR is not appropriate."
  when_not_to_use: "Categorical features, or when outliers are meaningful and should not be altered. Not recommended for highly skewed or non-normal data."
  alternatives:
    - "IQR Outlier Capping (manual, pandas)"
    - "RobustScaler (sklearn)"
    - "QuantileTransformer (sklearn)"
  code_example: |
    # Mean ± 3*StdDev outlier capping for a numeric column in pandas
    col = "feature_numeric"
    mean = df[col].mean()
    std = df[col].std()
    lower_bound = mean - 3 * std
    upper_bound = mean + 3 * std
    df[col] = df[col].clip(lower_bound, upper_bound)
  parameters:
    col: "The column to cap outliers for. Apply to each numeric column as needed."
    lower_bound: "Lower capping threshold (mean - 3*std)"
    upper_bound: "Upper capping threshold (mean + 3*std)"
  source_url: "https://en.wikipedia.org/wiki/Standard_deviation"
  source_license: "CC BY-SA 3.0"
  library: "pandas"
  python_package: "pandas"
  library_version: "2.2.0"
  supporting_excerpt: "The mean ± 3*std method is a common way to detect and cap outliers for approximately normal distributions."
  last_updated: "2026-01-02"
  confidence: 0.98
